name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      # A pinned snapshot, the OpenSCAD these examples are checked on: 2026.10.15 or
      # later, where textmetrics() is no longer experimental.
      - name: Install OpenSCAD snapshot and just
        # The AppImage and its checksum; update both together.
        env:
          OPENSCAD_SNAPSHOT: OpenSCAD-2026.10.15-x86_64.AppImage
          OPENSCAD_SHA256: 9d26e390d3a5c94f2e304d94d7b2eff77fb11fcd25829f2814de147ba92ac363
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends just libegl1 libgl1 libopengl0 libfontconfig1 libharfbuzz0b
          curl -fSL -o "$RUNNER_TEMP/openscad.AppImage" "https://files.openscad.org/snapshots/${OPENSCAD_SNAPSHOT}"
          echo "${OPENSCAD_SHA256}  ${RUNNER_TEMP}/openscad.AppImage" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/openscad.AppImage"
          printf '#!/bin/sh\nexec %s --appimage-extract-and-run "$@"\n' "$RUNNER_TEMP/openscad.AppImage" | sudo tee /usr/local/bin/openscad > /dev/null
          sudo chmod +x /usr/local/bin/openscad
          openscad --version

      - run: just test
